<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说、吃瓜在线搜索</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
        body{background:#f5f6f8;padding:60px 15px;}
        .wrap{max-width:580px;margin:0 auto;}
        .title{text-align:center;font-size:24px;color:#333;margin-bottom:20px;font-weight:normal;}
        /* 搜索框样式 */
        #search{
            width:100%;
            height:52px;
            padding:0 20px;
            font-size:16px;
            border:1px solid #dcdfe6;
            border-radius:12px;
            outline:none;
            background:#fff;
        }
        /* 搜索框下方提示文字 */
        .tip{
            text-align:center;
            font-size:13px;
            color:#999;
            margin-top:10px;
            margin-bottom:20px;
        }
        .result-box{margin-top:10px;}
        .item{
            background:#fff;
            line-height:48px;
            padding:0 20px;
            margin-bottom:10px;
            border-radius:10px;
            color:#1677ff;
            cursor:pointer;
            font-size:15px;
        }
        .empty{
            text-align:center;
            line-height:60px;
            color:#999;
            font-size:15px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="title">小说、吃瓜资源在线搜索</div>
        <input id="search" placeholder="请输入文件名称关键词搜索...">
        <!-- 这就是你要的：搜索框下面注释提示文字 -->
        <div class="tip">输入小说名字+作者即可搜索，比如斗破苍穹 天蚕土豆</div>
        <div class="result-box" id="resultBox"></div>
    </div>

<script>
// ====================== 【仅在这里添加文件 其他不用动】 ======================
// 格式示范：
// {name:"文件显示名字", link:"蓝奏云分享链接"},
let fileData = [
    {name:"员工管理制度", link:"https://xxx.lanzoui.com/xxxx"},
    {name:"客户对接话术", link:"https://xxx.lanzoui.com/xxxx"},
    {name:"报价单模板", link:"https://xxx.lanzoui.com/xxxx"}
    // 可无限往下加100条、200条都可以，首页不会全部展示
];
// =========================================================================

const searchInp = document.getElementById('search');
const resultBox = document.getElementById('resultBox');

// 初始空白：不展示任何文件列表，页面干净
resultBox.innerHTML = '';

searchInp.oninput = function(){
    let key = this.value.trim();
    if(!key){
        resultBox.innerHTML = '';
        return;
    }
    let matchList = fileData.filter(item=>item.name.includes(key));
    if(matchList.length === 0){
        resultBox.innerHTML = '<div class="empty">暂无匹配文件</div>';
        return;
    }
    let html = '';
    matchList.forEach(v=>{
        html += `<div class="item" onclick="window.open('${v.link}','_blank')">${v.name}</div>`;
    });
    resultBox.innerHTML = html;
}
</script>
</body>
</html>
