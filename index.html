const searchInp = document.getElementById('search');
const resultBox = document.getElementById('resultBox');

resultBox.innerHTML = '';

searchInp.oninput = function(){
    let key = this.value.trim();
    if(!key){
        resultBox.innerHTML = '';
        return;
    }
    let matchList = fileData.filter(item=>item.name.includes(key));
    if(matchList.length === 0){
        resultBox.innerHTML = '<div class="empty">暂无匹配文件</div>';
        return;
    }
    let html = '';
    matchList.forEach(v=>{
        html += `<div class="item" onclick="window.open('${v.link}','_blank')">${v.name}</div>`;
    });
    resultBox.innerHTML = html;
}
</script>
